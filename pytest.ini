[pytest]
markers =
    integration: marks tests as integration tests (requires external services like Weaviate)
    slow: marks tests as slow running
    unit: marks tests as unit tests (default)

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Minimum version
minversion = 7.0
