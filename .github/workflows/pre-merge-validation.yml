name: Pre-Merge Validation

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ feature/*, hotfix/*, release/* ]

env:
  ENVIRONMENT: development
  SECRET_KEY: test-secret-key-for-ci-validation
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Print Python Dependencies
      run: |
        echo "Installed packages:"
        pip freeze

    - name: Set up test environment variables
      run: |
        echo "ENVIRONMENT=development" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci-validation" >> $GITHUB_ENV
        echo "SUPABASE_URL=https://test.supabase.co" >> $GITHUB_ENV
        echo "SUPABASE_KEY=test-key" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=test-key" >> $GITHUB_ENV
        echo "WEAVIATE_URL=https://test.weaviate.com" >> $GITHUB_ENV
        echo "WEAVIATE_API_KEY=test-key" >> $GITHUB_ENV

    - name: Run tests
      run: |
        pytest -q

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run security scan
      run: |
        # Debug: Show current directory and files
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Git tracked files containing config.py:"
        git ls-files | grep config.py || echo "No config.py files found in git"
        echo "Looking for studywise/settings.py:"
        if [ ! -f "studywise/settings.py" ]; then
          echo "❌ studywise/settings.py not found!"
          exit 1
        fi

        # Check for hardcoded secrets
        demo_key="demo-secret-key-change-in-production"
        if grep -r "$demo_key" . --exclude-dir=.git --exclude-dir=.github --exclude-dir=scripts; then
          echo "❌ Found hardcoded demo secret key!"
          exit 1
        fi

        # Check for proper environment handling in unified settings
        config_file="studywise/settings.py"

        if ! grep -q "SECRET_KEY environment variable is required in production" "$config_file"; then
          echo "❌ Production secret key validation not found in $config_file!"
          exit 1
        fi

        echo "✅ Security scan passed"

  lint-and-format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install linting tools
      run: |
        pip install flake8 black isort

    - name: Run Black (code formatting)
      run: |
        black --check --diff .
      continue-on-error: true

    - name: Run isort (import sorting)
      run: |
        isort --check-only --diff .
      continue-on-error: true

    - name: Run flake8 (linting)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
